[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stickfight"
version = "0.2.0"
description = "Code-driven 2D stick figure fight animation and video engine"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "pygame-ce>=2.5.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
stickfight = "stickfight.cli:main"
stickfight-generate = "stickfight.generate_cli:main"

[tool.setuptools.packages.find]
include = ["stickfight*"]

[tool.setuptools.package-data]
"stickfight.gui" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
