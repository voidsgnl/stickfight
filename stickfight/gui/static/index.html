<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stick Fight Studio</title>
<style>
:root{
  --bg0:#121418;--bg1:#181b21;--bg2:#1f232b;--bg3:#272c36;--line:#2e3440;--line2:#3a4150;
  --tx:#d5dae3;--tx2:#8d96a6;--tx3:#5f6879;--acc:#5b9dff;--accd:#2a4a7d;
  --a:#ff6b7f;--b:#4cc2ff;--s:#f2b84b;--ok:#4cd49a;--err:#ff5d5d;
  --ui:"Segoe UI","SF Pro Text",Inter,system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--tx);font:12px/1.35 var(--ui);display:grid;grid-template-rows:26px 36px 1fr 22px;user-select:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
/* menu bar */
#menubar{background:var(--bg1);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6px;gap:2px;position:relative;z-index:50}
.logo{font-weight:700;color:var(--tx);padding:0 10px 0 4px;letter-spacing:.2px}
.logo i{display:inline-block;width:8px;height:8px;background:var(--a);margin-right:7px;transform:rotate(45deg)}
.menu{position:relative}
.menu>button{background:none;border:0;padding:3px 9px;border-radius:3px;cursor:default}
.menu>button:hover,.menu.open>button{background:var(--bg3)}
.drop{display:none;position:absolute;top:100%;left:0;min-width:210px;background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:3px;box-shadow:0 10px 30px #0009}
.menu.open .drop{display:block}
.drop button{display:flex;justify-content:space-between;gap:24px;width:100%;background:none;border:0;padding:4px 10px;border-radius:3px;text-align:left;cursor:default}
.drop button:hover{background:var(--accd)}
.drop kbd{color:var(--tx3);font:11px var(--mono)}
.drop hr{border:0;border-top:1px solid var(--line);margin:3px 2px}
#title{margin-left:auto;color:var(--tx3);padding-right:8px}
/* toolbar */
#toolbar{background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px}
.tb{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:4px 10px;cursor:pointer}
.tb:hover{border-color:var(--tx3)}
.tb.primary{background:var(--acc);border-color:var(--acc);color:#07101f;font-weight:600}
.tb.primary:hover{filter:brightness(1.1)}
.tb:disabled{opacity:.45;cursor:not-allowed}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:var(--bg1);border:0;padding:4px 12px;cursor:pointer;color:var(--tx2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accd);color:#fff}
#prog{margin-left:auto;display:none;align-items:center;gap:8px;color:var(--tx2)}
#prog .bar{width:180px;height:6px;background:var(--bg0);border:1px solid var(--line2);border-radius:3px;overflow:hidden}
#prog .bar i{display:block;height:100%;width:0;background:var(--acc)}
/* workspace */
#ws{display:grid;grid-template-columns:264px 1fr 250px;grid-template-rows:1fr 232px;gap:1px;background:var(--line);min-height:0}
.dock{background:var(--bg1);display:flex;flex-direction:column;min-height:0;min-width:0}
.dh{height:26px;flex:none;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;color:var(--tx2);gap:8px}
.dh b{color:var(--tx);font-weight:600}
.dh .sp{margin-left:auto}
.db{overflow:auto;flex:1;padding:10px}
.db::-webkit-scrollbar,.lanes::-webkit-scrollbar{width:9px;height:9px}
.db::-webkit-scrollbar-thumb,.lanes::-webkit-scrollbar-thumb{background:var(--bg3);border:2px solid var(--bg1);border-radius:5px}
#left{grid-row:1/3}
.tabs{display:flex;background:var(--bg0);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:6px;color:var(--tx2);cursor:pointer}
.tabs button.on{background:var(--bg1);color:var(--tx)}
.tabs button[data-s=a].on{border-color:var(--a)}
.tabs button[data-s=b].on{border-color:var(--b)}
.grp{margin-bottom:12px}
.grp>label,.lbl{display:block;color:var(--tx2);margin-bottom:4px}
.row{display:flex;align-items:center;gap:6px}
input[type=text],input[type=number],select{width:100%;background:var(--bg0);border:1px solid var(--line2);border-radius:3px;padding:4px 7px;user-select:text}
input:focus,select:focus{border-color:var(--acc);outline:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.opt{background:var(--bg0);border:1px solid var(--line2);border-radius:3px;padding:5px 2px;text-align:center;cursor:pointer;color:var(--tx2)}
.opt:hover{color:var(--tx);border-color:var(--tx3)}
.opt.on{color:#fff;background:var(--accd);border-color:var(--acc)}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:24px;border:1px solid var(--line2);border-radius:3px;background:none;padding:1px;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}
.sw{width:16px;height:16px;border-radius:3px;border:1px solid var(--line2);cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--acc)}
.val{font:11px var(--mono);color:var(--tx);margin-left:auto}
.tog{display:flex;align-items:center;justify-content:space-between}
.tog input{accent-color:var(--acc)}
/* viewport */
#view{background:var(--bg0);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:linear-gradient(45deg,#15181d 25%,transparent 25%,transparent 75%,#15181d 75%),linear-gradient(45deg,#15181d 25%,transparent 25%,transparent 75%,#15181d 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}
#view img,#view video{max-width:calc(100% - 24px);max-height:calc(100% - 24px);box-shadow:0 0 0 1px var(--line2),0 8px 30px #000a}
#view video{display:none}
#vbadge{position:absolute;top:8px;left:8px;background:#000a;border:1px solid var(--line2);border-radius:3px;padding:2px 8px;color:var(--tx2);font:11px var(--mono)}
#dl{position:absolute;top:8px;right:8px;display:none;text-decoration:none}
/* timeline */
#tl{grid-column:2}
.tlbody{display:grid;grid-template-columns:86px 1fr;flex:1;min-height:0}
.heads{background:var(--bg2);border-right:1px solid var(--line);padding-top:22px}
.heads div{height:34px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);font-weight:600}
.lanes{overflow:auto;position:relative}
.ruler{height:22px;position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);z-index:3}
.ruler span{position:absolute;top:5px;padding-left:4px;border-left:1px solid var(--line2);height:17px;font:10px var(--mono);color:var(--tx3)}
.lane{height:34px;border-bottom:1px solid var(--line);position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 79px,#ffffff08 79px 80px)}
.ev{position:absolute;top:5px;height:24px;border-radius:3px;padding:0 6px;line-height:22px;white-space:nowrap;overflow:hidden;cursor:pointer;font-size:11px;border:1px solid;min-width:14px}
.ev.A{background:#ff6b7f30;border-color:var(--a);color:#ffc0c8}
.ev.B{background:#4cc2ff30;border-color:var(--b);color:#bfeaff}
.ev.scene{background:#f2b84b30;border-color:var(--s);color:#fbe3ae}
.ev.sel{box-shadow:0 0 0 2px #fff8}
.empty{padding:14px;color:var(--tx3)}
.addbar{flex:none;display:grid;grid-template-columns:64px 110px 1fr 64px auto auto;gap:6px;padding:6px 8px;background:var(--bg2);border-top:1px solid var(--line)}
#tl.dim .tlbody{opacity:.4;pointer-events:none}
/* right */
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font:11px var(--mono);color:var(--tx2)}
.kv b{color:var(--tx);font-weight:400}
/* status */
#status{background:var(--accd);display:flex;align-items:center;gap:16px;padding:0 10px;font-size:11px;color:#dbe7ff}
#status .r{margin-left:auto}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
/* palette */
#pal{display:none;position:fixed;inset:0;background:#0008;z-index:99;align-items:flex-start;justify-content:center;padding-top:14vh}
#pal.on{display:flex}
#pal div{width:460px;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:8px;box-shadow:0 20px 60px #000}
#pal ul{list-style:none;margin-top:6px;max-height:280px;overflow:auto}
#pal li{padding:5px 8px;border-radius:3px;cursor:default}
#pal li.on{background:var(--accd)}
@media(max-width:1000px){#ws{grid-template-columns:230px 1fr}#right{display:none}}
</style>
</head>
<body>

<div id="menubar">
  <span class="logo"><i></i>Stick Fight Studio</span>
  <div class="menu"><button>File</button><div class="drop">
    <button onclick="startRender()">Render video<kbd>Ctrl+Enter</kbd></button>
    <hr>
    <button onclick="loadPreset('ninja_vs_samurai')">Preset: Ninja vs Samurai</button>
    <button onclick="loadPreset('cyborg_vs_ninja')">Preset: Cyber Clash</button>
    <button onclick="loadPreset('brawler_vs_monk')">Preset: Street vs Shaolin</button>
    <button onclick="loadPreset('realistic_boxing')">Preset: Boxing Title</button>
    <button onclick="loadPreset('realistic_mma')">Preset: MMA Championship</button>
    <button onclick="loadPreset('classic_showdown')">Preset: Classic Duel</button></div></div>
  <div class="menu"><button>Edit</button><div class="drop">
    <button onclick="randomizeAll()">Randomize fighters<kbd>Ctrl+R</kbd></button>
    <button onclick="deleteSelected()">Delete selected action<kbd>Del</kbd></button>
    <button onclick="clearTimeline()">Clear timeline</button></div></div>
  <div class="menu"><button>View</button><div class="drop">
    <button onclick="switchChoreographyMode('procedural')">Procedural mode</button>
    <button onclick="switchChoreographyMode('timeline')">Timeline mode</button>
    <hr><button onclick="schedulePreview()">Refresh preview<kbd>F5</kbd></button></div></div>
  <div class="menu"><button>Tools</button><div class="drop">
    <button onclick="openPalette()">Command palette<kbd>Ctrl+K</kbd></button></div></div>
  <span id="title">Untitled fight</span>
</div>

<div id="toolbar">
  <button class="tb primary" id="btnRender" onclick="startRender()">Render video</button>
  <a class="tb" id="btnDownload" href="#" download style="display:none;text-decoration:none">Download MP4</a>
  <span class="sep"></span>
  <div class="seg" id="modeSeg">
    <button id="tabProcedural" class="on" onclick="switchChoreographyMode('procedural')">Procedural</button>
    <button id="tabTimeline" onclick="switchChoreographyMode('timeline')">Timeline</button>
  </div>
  <span class="sep"></span>
  <button class="tb" onclick="randomizeAll()">Randomize</button>
  <button class="tb" onclick="openPalette()">Commands</button>
  <div id="prog"><span id="progressStatus">Rendering</span><div class="bar"><i id="progressBarFill"></i></div><span id="progressPct" style="font-family:var(--mono)">0%</span></div>
</div>

<div id="ws">
  <!-- Left: fighter inspector -->
  <section class="dock" id="left">
    <div class="dh"><b>Fighter inspector</b></div>
    <div class="tabs"><button data-s="a" class="on" onclick="setSide('a')">Fighter A</button><button data-s="b" onclick="setSide('b')">Fighter B</button></div>
    <div class="db">
      <div class="grp"><label>Name</label><input type="text" id="f_name" oninput="schedulePreview()"></div>
      <div class="grp"><label>Archetype</label><div class="grid3" id="f_arch"></div></div>
      <div class="grp"><label>Weapon</label><div class="grid3" id="f_weapon"></div></div>
      <div class="grp"><label>Suit color</label><div class="row"><input type="color" id="f_color" oninput="schedulePreview()"><span id="sw_suit" class="row"></span></div></div>
      <div class="grp"><label>Headband color</label><div class="row"><input type="color" id="f_headband" oninput="schedulePreview()"><span id="sw_band" class="row"></span></div></div>
      <div class="grp"><label class="row">Scale<span class="val" id="f_scale_lbl">1.0x</span></label><input type="range" id="f_scale" min="0.8" max="1.3" step="0.05" value="1" oninput="schedulePreview()"></div>
    </div>
  </section>

  <!-- Center: viewport -->
  <section class="dock" style="grid-column:2">
    <div class="dh"><b>Viewport</b><span id="vdim"></span></div>
    <div id="view">
      <span id="vbadge">SNAPSHOT</span>
      <img id="previewImg" alt="Fight preview" src="">
      <video id="videoPlayer" controls loop playsinline></video>
    </div>
  </section>

  <!-- Right: scene -->
  <section class="dock" id="right" style="grid-row:1/3;grid-column:3">
    <div class="dh"><b>Scene</b></div>
    <div class="db">
      <div class="grp"><label>Combat style</label><div class="grid3" style="grid-template-columns:1fr 1fr" id="style_sel"></div></div>
      <div class="grp"><label>Environment</label><div class="grid3" style="grid-template-columns:1fr 1fr" id="env_sel"></div></div>
      <div class="grp"><label>Aspect ratio</label><div class="grid3" id="fmt_sel"></div></div>
      <div class="grp" id="durGroup"><label class="row">Duration<span class="val" id="duration_lbl">6.5s</span></label><input type="range" id="duration" min="3" max="12" step="0.5" value="6.5" oninput="updateDuration()"></div>
      <div class="grp tog"><label style="margin:0">Fighting game UI bars</label><input type="checkbox" id="show_ui" checked onchange="schedulePreview()"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:4px 0 10px">
      <div class="lbl">Project</div>
      <div class="kv"><span>Mode</span><b id="k_mode"></b><span>Style</span><b id="k_style"></b><span>Actions</span><b id="k_ev"></b><span>Output</span><b id="k_out"></b></div>
    </div>
  </section>

  <!-- Bottom: timeline -->
  <section class="dock" id="tl">
    <div class="dh"><b>Timeline</b><span id="eventCount">0 actions</span>
      <span class="sp row"><button class="tb" style="padding:1px 8px" onclick="loadPresetTimeline()">Load preset</button><button class="tb" style="padding:1px 8px" onclick="clearTimeline()">Clear</button></span></div>
    <div class="tlbody">
      <div class="heads"><div style="color:var(--a)">Fighter A</div><div style="color:var(--b)">Fighter B</div><div style="color:var(--s)">Scene</div></div>
      <div class="lanes" id="lanes"></div>
    </div>
    <div class="addbar">
      <input type="number" id="add_time" value="1.0" step="0.1" min="0" title="Start time (s)">
      <select id="add_actor"><option value="A">Fighter A</option><option value="B">Fighter B</option><option value="scene">Scene</option></select>
      <select id="add_action"></select>
      <input type="number" id="add_dur" value="0.4" step="0.05" min="0.1" title="Duration (s)">
      <button class="tb" onclick="addCustomAction()">Add action</button>
      <button class="tb" onclick="deleteSelected()">Delete</button>
    </div>
  </section>
</div>

<div id="status">
  <span><span class="dot" id="sdot"></span><span id="sconn">Backend ready</span></span>
  <span id="sframe">Idle</span>
  <span class="r" id="sfmt"></span>
</div>

<div id="pal"><div><input type="text" id="palIn" placeholder="Type a command"><ul id="palList"></ul></div></div>

<script>
const PX=80;
const state={mode:"procedural",style:"arcade",
  fighter_a:{name:"Shadow",archetype:"ninja",weapon:"sword",color:"#2d3038",headband_color:"#eb2d2d",scale:1.0,health:100,line_width:10},
  fighter_b:{name:"Kensei",archetype:"warrior",weapon:"sword",color:"#e6ebf5",headband_color:"#ebbe2d",scale:1.0,health:100,line_width:10},
  environment:"dojo",format:"vertical",duration:6.5,show_ui:true,timeline:[]};
let side='a',currentPresets=[],previewTimer=null,selected=-1;

const ARCH=['ninja','warrior','monk','cyber','brawler','classic'];
const WEAP=[['none','Bare hands'],['sword','Katana'],['staff','Bo staff']];
const STYLES=[['arcade','Arcade'],['realistic','Realistic']];
const ENVS=[['dojo','Dojo'],['cyberpunk','Cyber'],['city','City'],['plain','Plain']];
const FMTS=[['vertical','9:16'],['horizontal','16:9'],['square','1:1']];
const ACTIONS={"Realistic combat":[['jab','Lead jab'],['cross','Rear cross'],['hook','Hook punch'],['low_kick','Low kick'],['check_kick','Check kick'],['slip','Head slip'],['bob_weave','Bob and weave'],['clinch_knee','Clinch knee'],['takedown','Double-leg takedown'],['ground_pound','Ground and pound'],['stagger','Heavy stagger']],
"Arcade and martial arts":[['throw','Throw / slam'],['dive_kick','Aerial dive kick'],['air_juggle','Air juggle'],['wall_bounce','Wall bounce'],['punch','Punch'],['kick','High kick'],['uppercut','Uppercut'],['sweep','Sweep'],['slash','Sword slash'],['staff_strike','Staff strike'],['block','Block / parry'],['dodge','Matrix dodge'],['jump','Jump / flip'],['knockback','Knockback'],['fall','Fall (KO)'],['walk_to','Walk to target'],['caption','Screen caption']]};
const SWS={suit:['#2d3038','#e63946','#00d2ff','#f58c23','#e6ebf5'],band:['#eb2d2d','#ffb700','#00e5ff','#ffffff']};
const $=id=>document.getElementById(id);
const F=()=>state['fighter_'+side];

function seg(el,items,cur,fn){el.innerHTML='';items.forEach(it=>{const [v,l]=Array.isArray(it)?it:[it,it[0].toUpperCase()+it.slice(1)];
  const d=document.createElement('div');d.className='opt'+(v===cur?' on':'');d.dataset.v=v;d.textContent=l;d.onclick=()=>fn(v);el.appendChild(d)})}
function mark(el,v){el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.v===v))}

function buildStatic(){
  const sel=$('add_action');Object.entries(ACTIONS).forEach(([g,list])=>{const og=document.createElement('optgroup');og.label=g;
    list.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;og.appendChild(o)});sel.appendChild(og)});
  seg($('style_sel'),STYLES,state.style,selectStyle);seg($('env_sel'),ENVS,state.environment,selectEnv);seg($('fmt_sel'),FMTS,state.format,selectFormat);
  [['sw_suit',SWS.suit,'f_color'],['sw_band',SWS.band,'f_headband']].forEach(([id,list,inp])=>{
    list.forEach(c=>{const s=document.createElement('span');s.className='sw';s.style.background=c;s.onclick=()=>{$(inp).value=c;schedulePreview()};$(id).appendChild(s)})});
}
function loadInspector(){
  const f=F();$('f_name').value=f.name;$('f_color').value=f.color;$('f_headband').value=f.headband_color;$('f_scale').value=f.scale;$('f_scale_lbl').textContent=f.scale.toFixed(2)+'x';
  seg($('f_arch'),ARCH,f.archetype,selectArchetype);seg($('f_weapon'),WEAP,f.weapon,selectWeapon);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===side));
}
function setSide(s){side=s;loadInspector()}
function selectArchetype(t){F().archetype=t;mark($('f_arch'),t);schedulePreview()}
function selectWeapon(w){F().weapon=w;mark($('f_weapon'),w);schedulePreview()}
function selectStyle(v){state.style=v;mark($('style_sel'),v);refreshInfo()}
function selectEnv(v){state.environment=v;mark($('env_sel'),v);schedulePreview()}
function selectFormat(v){state.format=v;mark($('fmt_sel'),v);schedulePreview()}
function updateDuration(){state.duration=parseFloat($('duration').value);$('duration_lbl').textContent=state.duration+'s';refreshInfo()}
function refreshInfo(){$('k_mode').textContent=state.mode;$('k_style').textContent=state.style;$('k_ev').textContent=state.timeline.length;
  const f=FMTS.find(x=>x[0]===state.format);$('k_out').textContent=f?f[1]:'';$('sfmt').textContent=state.environment+'  |  '+(f?f[1]:'');
  $('title').textContent=state.fighter_a.name+' vs '+state.fighter_b.name}

function switchChoreographyMode(m){state.mode=m;
  $('tabProcedural').classList.toggle('on',m==='procedural');$('tabTimeline').classList.toggle('on',m==='timeline');
  $('tl').classList.toggle('dim',m!=='timeline');$('durGroup').style.opacity=m==='timeline'?.45:1;
  if(m==='timeline'&&!state.timeline.length)loadPresetTimeline();else renderTimelineTracks();refreshInfo()}

function renderTimelineTracks(){
  state.timeline.sort((a,b)=>parseFloat(a.time)-parseFloat(b.time));
  const end=Math.max(state.duration,...state.timeline.map(e=>parseFloat(e.time)+parseFloat(e.duration||.5)))+1;
  const w=Math.ceil(end)*PX,L=$('lanes');L.innerHTML='';
  const ruler=document.createElement('div');ruler.className='ruler';ruler.style.width=w+'px';
  for(let i=0;i<=Math.ceil(end);i++){const s=document.createElement('span');s.style.left=i*PX+'px';s.textContent=i+'s';ruler.appendChild(s)}
  L.appendChild(ruler);
  const lanes={A:null,B:null,scene:null};
  Object.keys(lanes).forEach(k=>{const d=document.createElement('div');d.className='lane';d.style.width=w+'px';lanes[k]=d;L.appendChild(d)});
  state.timeline.forEach((ev,i)=>{const b=document.createElement('div');b.className='ev '+ev.actor+(i===selected?' sel':'');
    b.style.left=parseFloat(ev.time)*PX+'px';b.style.width=Math.max(14,parseFloat(ev.duration||.5)*PX)+'px';
    b.textContent=ev.action.replace(/_/g,' ')+(ev.text?': '+ev.text:'');b.title=ev.action+' at '+parseFloat(ev.time).toFixed(2)+'s';
    b.onclick=()=>{selected=i;renderTimelineTracks()};(lanes[ev.actor]||lanes.scene).appendChild(b)});
  $('eventCount').textContent=state.timeline.length+' actions';refreshInfo()}

function deleteSelected(){if(selected<0)return;state.timeline.splice(selected,1);selected=-1;renderTimelineTracks()}
function clearTimeline(){state.timeline=[];selected=-1;renderTimelineTracks()}
function addCustomAction(){
  const t=parseFloat($('add_time').value)||0,actor=$('add_actor').value,action=$('add_action').value,dur=parseFloat($('add_dur').value)||.5;
  const ev={time:t,actor,action,duration:dur};
  if(action==='caption')ev.text=prompt('Caption text:','ROUND 1')||'ROUND 1';
  state.timeline.push(ev);$('add_time').value=(t+.6).toFixed(1);renderTimelineTracks()}
function loadPresetTimeline(){
  const m=currentPresets.find(p=>p.fighter_a.archetype===state.fighter_a.archetype)||currentPresets[0];
  if(m&&m.timeline)state.timeline=JSON.parse(JSON.stringify(m.timeline));renderTimelineTracks()}

function schedulePreview(){
  const f=F();f.name=$('f_name').value;f.color=$('f_color').value;f.headband_color=$('f_headband').value;f.scale=parseFloat($('f_scale').value);
  $('f_scale_lbl').textContent=f.scale.toFixed(2)+'x';state.show_ui=$('show_ui').checked;refreshInfo();
  clearTimeout(previewTimer);previewTimer=setTimeout(fetchPreview,120)}
async function fetchPreview(){
  try{const r=await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    if(r.ok){const b=await r.blob(),img=$('previewImg');img.src=URL.createObjectURL(b);
      img.onload=()=>$('vdim').textContent=img.naturalWidth+' x '+img.naturalHeight+' px';switchViewMode('preview');conn(true)}
  }catch(e){conn(false)}}
function conn(ok){$('sdot').style.background=ok?'var(--ok)':'var(--err)';$('sconn').textContent=ok?'Backend ready':'Backend unreachable'}
function switchViewMode(m){const v=m==='video';$('previewImg').style.display=v?'none':'block';$('videoPlayer').style.display=v?'block':'none';$('vbadge').textContent=v?'RENDERED VIDEO':'SNAPSHOT'}

function setBusy(on){$('btnRender').disabled=on;$('btnRender').textContent=on?'Rendering...':'Render video';$('prog').style.display=on?'flex':'none'}
async function startRender(){
  schedulePreview();setBusy(true);$('btnDownload').style.display='none';$('progressBarFill').style.width='0';
  try{const r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    if(r.ok)pollProgress();else{const d=await r.json();alert('Render failed: '+(d.error||'Unknown error'));setBusy(false)}
  }catch(e){alert('Render error: '+e);setBusy(false)}}
async function pollProgress(){
  try{const d=await(await fetch('/api/status')).json();
    if(d.status==='rendering'){const p=Math.round(d.progress*100);$('progressBarFill').style.width=p+'%';$('progressPct').textContent=p+'%';
      $('sframe').textContent='Frame '+d.frame+' / '+d.total_frames+'  |  '+d.fps.toFixed(1)+' fps';setTimeout(pollProgress,250)}
    else if(d.status==='done'){setBusy(false);$('sframe').textContent='Render complete';
      const v=$('videoPlayer');v.src=d.video_url+'?t='+Date.now();switchViewMode('video');v.play().catch(()=>{});
      const dl=$('btnDownload');dl.href=d.video_url;dl.style.display='inline-block'}
    else if(d.status==='error'){setBusy(false);$('sframe').textContent='Render failed: '+d.error}
    else setTimeout(pollProgress,400)
  }catch(e){setTimeout(pollProgress,500)}}

async function loadPreset(id){
  try{currentPresets=await(await fetch('/api/presets')).json();const p=currentPresets.find(i=>i.id===id);if(!p)return;
    Object.assign(state.fighter_a,{name:p.fighter_a.name,color:p.fighter_a.color,archetype:p.fighter_a.archetype,weapon:p.fighter_a.weapon||'none',scale:p.fighter_a.scale||1});
    if(p.fighter_a.headband_color)state.fighter_a.headband_color=p.fighter_a.headband_color;
    Object.assign(state.fighter_b,{name:p.fighter_b.name,color:p.fighter_b.color,archetype:p.fighter_b.archetype,weapon:p.fighter_b.weapon||'none'});
    if(p.fighter_b.headband_color)state.fighter_b.headband_color=p.fighter_b.headband_color;
    selectStyle(p.style||'arcade');selectEnv(p.environment||'dojo');selectFormat(p.format||'vertical');
    if(p.duration){$('duration').value=p.duration;updateDuration()}
    if(p.timeline){state.timeline=JSON.parse(JSON.stringify(p.timeline));renderTimelineTracks()}
    loadInspector();schedulePreview()}catch(e){console.error(e)}}
function randomizeAll(){
  const r=a=>a[Math.floor(Math.random()*a.length)],cols=['#2d3038','#e6ebf5','#e63946','#00d2ff','#f58c23','#9b5de5','#00f5d4'];
  const ca=r(cols);let cb=r(cols);if(ca===cb)cb='#f0f3f8';
  Object.assign(state.fighter_a,{archetype:r(ARCH),weapon:r(WEAP)[0],color:ca});Object.assign(state.fighter_b,{archetype:r(ARCH),weapon:r(WEAP)[0],color:cb});
  selectEnv(r(ENVS)[0]);loadInspector();schedulePreview()}

/* menus */
document.querySelectorAll('.menu>button').forEach(b=>b.onclick=e=>{e.stopPropagation();const m=b.parentElement,o=m.classList.contains('open');
  document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));if(!o)m.classList.add('open')});
document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open')));

/* command palette */
const CMDS=[['Render video',()=>startRender()],['Randomize fighters',randomizeAll],['Switch to timeline mode',()=>switchChoreographyMode('timeline')],['Switch to procedural mode',()=>switchChoreographyMode('procedural')],['Clear timeline',clearTimeline],['Refresh preview',schedulePreview],
  ...['ninja_vs_samurai','cyborg_vs_ninja','brawler_vs_monk','realistic_boxing','realistic_mma','classic_showdown'].map(id=>['Load preset: '+id.replace(/_/g,' '),()=>loadPreset(id)])];
let pi=0,pv=CMDS;
function drawPal(){const q=$('palIn').value.toLowerCase();pv=CMDS.filter(c=>c[0].toLowerCase().includes(q));pi=Math.min(pi,Math.max(0,pv.length-1));
  $('palList').innerHTML='';pv.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c[0];li.className=i===pi?'on':'';li.onclick=()=>runPal(i);$('palList').appendChild(li)})}
function openPalette(){$('pal').classList.add('on');$('palIn').value='';pi=0;drawPal();$('palIn').focus()}
function runPal(i){$('pal').classList.remove('on');if(pv[i])pv[i][1]()}
$('palIn').oninput=()=>{pi=0;drawPal()};
$('pal').onclick=e=>{if(e.target===$('pal'))$('pal').classList.remove('on')};
$('palIn').onkeydown=e=>{if(e.key==='ArrowDown'){pi=Math.min(pi+1,pv.length-1);drawPal()}else if(e.key==='ArrowUp'){pi=Math.max(pi-1,0);drawPal()}else if(e.key==='Enter')runPal(pi);else if(e.key==='Escape')$('pal').classList.remove('on')};

/* shortcuts */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT/.test(document.activeElement.tagName);
  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();startRender()}
  else if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if(e.ctrlKey&&e.key.toLowerCase()==='r'){e.preventDefault();randomizeAll()}
  else if(e.key==='F5'){e.preventDefault();schedulePreview()}
  else if(e.key==='Delete'&&!typing)deleteSelected()});

window.addEventListener('DOMContentLoaded',async()=>{
  buildStatic();loadInspector();switchChoreographyMode('procedural');
  try{currentPresets=await(await fetch('/api/presets')).json()}catch(e){}
  schedulePreview()});
</script>
</body>
